[tool.poetry]
name = "qontinui-hal-mcp"
version = "0.1.0"
description = "GhostDesk-compatible MCP server exposing qontinui's HAL (screen + input) to external agents"
authors = ["Qontinui Team"]
license = "MIT"
readme = "README.md"
keywords = ["mcp", "automation", "hal", "qontinui", "ghostdesk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [{include = "qontinui_hal_mcp", from = "src"}]

[tool.poetry.scripts]
qontinui-hal-mcp = "qontinui_hal_mcp.__main__:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.14.1 || >3.14.1,<3.15"
mcp = "^1.0.0"
pydantic = "^2.0.0"
pillow = "^12"
starlette = "^0.42"
uvicorn = "^0.37"
qontinui = { path = "../qontinui", develop = true }

[tool.poetry.group.dev.dependencies]
black = "^26"
ruff = "^0.15"
mypy = "^1.14"
pytest = "^9"

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
